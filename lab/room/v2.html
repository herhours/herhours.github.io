<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EADFCD">
<meta name="robots" content="noindex,nofollow">
<title>Her Room · 메인 시안</title>
<link rel="stylesheet" href="kit.css">
<style>
/* 10-22 영샘 "배경이 세계이고 기능이 그 세계 안에" — 메인 화면 시안: 그녀의 방 (밝게 · 세련 · 여백, 영샘 레퍼런스 5장 결).
   The room is the page. The arch is the window the short plays in. Each tool is a thing in the room:
   mirror = style (tap: the style frames rise and orbit the arch), photos = 사진, turntable = 노래, notebook = 글자,
   candle = 만들기. Positions are % of the 1024x1536 picture, so they stay on their things at any phone size.
   10-22 영샘 "고정된 건 없다 — 조금씩 움직임이 있다. 배경도 확대, 스타일 한 장 한 장도. 모든 움직임은 터치에 엄청 민감하고
   극도로 부드럽게": one motion engine (script) drives everything - the room breathes, layers drift at different depths
   with the finger, the room pinches/pans/double-taps, the style frames lift and zoom, and every release hands its speed
   to a no-bounce spring. Nothing here uses CSS transitions for movement that a finger can touch. */
@font-face{font-family:HHTitle;src:url(fonts/PinyonScript-Regular.ttf)}
@font-face{font-family:HHSans;src:url(fonts/JosefinSans-SemiBold.ttf)}
:root{--gold:#B8893E;--ink:#3B2F22}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;
  background:linear-gradient(#F4ECDF 0%,#E8DAC4 60%,#D3BC9C 100%);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:none}

/* the picture sits on the floor of the screen; a phone's extra height becomes quiet wall above it (여백).
   A short screen keeps ~100px of wall for the name; the room's sides melt into the wall colour. */
.world{position:fixed;left:50%;bottom:0;width:min(106vw,calc((100dvh - 100px) * 2 / 3));aspect-ratio:2/3;translate:-50% 0;
  transform-origin:50% 50%;will-change:transform;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent)}
.world > img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-drag:none;pointer-events:none}
.world::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:60vh;pointer-events:none;
  background:linear-gradient(to top,#CDB596 0%,rgba(232,218,196,0) 100%)}
/* sun motes drifting in the window light (inside the room, so they zoom with it) */
.motes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.motes i{position:absolute;width:var(--d);height:var(--d);border-radius:50%;background:radial-gradient(circle,rgba(255,246,220,.95),rgba(255,226,170,0) 70%);opacity:0}
@media (prefers-reduced-motion:no-preference){.motes i{animation:mote var(--t) linear var(--dl) infinite}
  @keyframes mote{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}80%{opacity:.7}100%{opacity:0;transform:translate(var(--mx),var(--my))}}}

/* 10-22 영샘 원칙 11 "조명 — 한쪽에서 들어오는 빛 · 특정 부분만 비추는 조명 · 동작을 따라오는 빛":
   a shaft of window light slanting in from the right, swaying extremely slowly; the corners kept a touch darker so the
   arch and the daybed are lit; and (below, .touchlight) a warm light that blooms under the finger and follows it */
.beam{position:absolute;inset:-10% -20%;pointer-events:none;mix-blend-mode:screen;opacity:.55;z-index:1;
  background:linear-gradient(112deg,transparent 38%,rgba(255,226,170,.0) 44%,rgba(255,224,165,.55) 52%,rgba(255,236,200,.25) 58%,transparent 66%);filter:blur(14px);transform-origin:80% 10%}
@media (prefers-reduced-motion:no-preference){.beam{animation:sway 26s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(0deg) translateX(0);opacity:.5}50%{transform:rotate(-3deg) translateX(-4%);opacity:.68}}}
.shade{position:absolute;inset:0;pointer-events:none;z-index:1;mix-blend-mode:multiply;
  background:radial-gradient(85% 70% at 52% 38%,rgba(255,255,255,0) 55%,rgba(150,110,60,.28) 100%)}
.touchlight{position:fixed;left:0;top:0;width:380px;height:380px;margin:-190px 0 0 -190px;pointer-events:none;z-index:6;border-radius:50%;
  background:radial-gradient(circle,rgba(255,236,196,.55),rgba(255,214,150,.22) 38%,rgba(255,210,140,0) 70%);mix-blend-mode:soft-light;opacity:0;will-change:transform,opacity}

/* the short plays inside the arch, in its own small arch - nearer than the wall, so it drifts a little more */
.screen{position:absolute;left:32.9%;top:5.1%;width:34.9%;height:41.3%;overflow:hidden;z-index:2;
  translate:var(--sx,0px) var(--sy,0px);border-radius:50% 50% 6px 6px / 27% 27% 6px 6px;
  box-shadow:0 0 0 2px rgba(233,201,139,.9),0 0 0 7px rgba(255,248,236,.55),0 18px 50px rgba(120,80,30,.35),0 0 60px rgba(255,236,200,.8)}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity 260ms;pointer-events:none}
.screen video.out{opacity:0}

/* things you can touch: a breathing light and a small two-language glass name - the nearest layer, they drift most */
.spot{position:absolute;left:var(--x);top:var(--y);translate:calc(-50% + var(--px,0px)) calc(-50% + var(--py,0px));
  width:var(--s,60px);height:var(--s,60px);border-radius:50%;display:grid;place-items:center;z-index:3;transition:opacity 600ms cubic-bezier(.65,0,.35,1)}
.spot::before{content:"";position:absolute;inset:22%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,252,240,.95),rgba(255,226,170,.55) 50%,rgba(255,220,160,0) 74%);
  box-shadow:0 0 0 1.5px rgba(255,255,255,.95),0 0 16px rgba(255,214,140,.9);transition:transform 380ms cubic-bezier(.22,1,.36,1)}
@media (prefers-reduced-motion:no-preference){.spot::before{animation:breathe 3.2s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.2)}}
  .tag{animation:bob var(--bt,5s) ease-in-out var(--bd,0s) infinite}@keyframes bob{50%{transform:translateY(-3px)}}}
.spot.press::before{transform:scale(.8);animation:none}
.tag{position:absolute;top:50%;white-space:nowrap;display:flex;flex-direction:column;line-height:1.15;pointer-events:none;
  padding:6px 12px 7px;border-radius:14px;background:var(--k-face);
  -webkit-backdrop-filter:blur(var(--k-blur)) saturate(150%);backdrop-filter:blur(var(--k-blur)) saturate(150%);box-shadow:var(--k-light)}
.r .tag{left:calc(100% - 8px);translate:0 -50%}.l .tag{right:calc(100% - 8px);translate:0 -50%;align-items:flex-end}
.u .tag{left:50%;top:auto;bottom:calc(100% - 6px);translate:-50% 0;align-items:center}.d .tag{left:50%;top:calc(100% - 6px);translate:-50% 0;align-items:center}
/* 10-22 영샘: small type is fine where small suits the design - the names whisper, the room speaks */
.tag small{font-family:HHSans,sans-serif;font-size:9.5px;letter-spacing:.26em;color:var(--gold);text-shadow:var(--k-text-depth)}
.tag b{font-size:13px;font-weight:700;color:var(--ink);text-shadow:var(--k-text-depth)}

/* the brand lives in the wall space above the room - farthest layer, it barely moves */
.brand{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 18px);z-index:5;text-align:center;pointer-events:none;
  translate:var(--bx,0px) var(--by,0px);transition:opacity 900ms cubic-bezier(.65,0,.35,1)}
/* 10-22 영샘 "모든 것은 입체감 — 텍스트든 뭐든": titles raised in gold, words sit proud of the wall (kit.css depths) */
.brand b{display:block;font-family:HHTitle,cursive;font-weight:400;font-size:46px;line-height:1.1;color:#D9AE62;text-shadow:var(--k-title-depth)}
.brand small{display:block;margin-top:6px;font-family:HHSans,sans-serif;font-size:11px;letter-spacing:.38em;color:var(--ink);opacity:.8;text-shadow:var(--k-text-depth)}
.brand p{margin-top:10px;font-size:14px;color:var(--ink);opacity:.85;text-shadow:var(--k-text-depth)}
@media (max-height:760px){.brand{top:calc(env(safe-area-inset-top,0px) + 10px)}.brand b{font-size:38px}.brand p{display:none}
  .cap{top:calc(env(safe-area-inset-top,0px) + 10px)}.cap b{font-size:36px}.cap small{margin-top:4px}}
body.zoomed .brand,body.orbit .brand,body.lifted .brand{opacity:0}

/* ---------- the style orbit ---------- */
.dim{position:absolute;inset:0;z-index:4;background:radial-gradient(70% 50% at 50% 30%,rgba(40,28,12,.10),rgba(40,28,12,.45));opacity:0;pointer-events:none;transition:opacity 800ms cubic-bezier(.65,0,.35,1)}
body.orbit .dim{opacity:1;pointer-events:auto}
body.orbit .spot{opacity:0;pointer-events:none}
/* no z-index here on purpose: the cards then stack with the arch itself, so the back of the ring passes behind it */
.orbit{position:absolute;left:50.3%;top:26%;width:0;height:0;pointer-events:none}
.card{position:absolute;left:0;top:0;width:calc(var(--W) * .2);aspect-ratio:9/16;margin:calc(var(--W) * -.178) 0 0 calc(var(--W) * -.1);
  border-radius:14px;overflow:hidden;pointer-events:none;opacity:0;will-change:transform,opacity;
  background:#2a2016 center/cover;box-shadow:0 0 0 2px #F6DFA9,0 0 0 4px rgba(184,137,62,.85),0 16px 34px rgba(60,35,10,.45)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 35%)}
body.orbit .card{pointer-events:auto}   /* closed, the invisible frames must not catch taps meant for the room */
body.orbit .screen{z-index:6}
.cap{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 22px);z-index:7;text-align:center;pointer-events:none;opacity:0;transition:opacity 700ms cubic-bezier(.65,0,.35,1)}
body.orbit .cap{opacity:1}
.cap b{display:block;font-family:HHTitle,cursive;font-weight:400;font-size:44px;line-height:1.1;color:#D9AE62;text-shadow:var(--k-title-depth)}
.cap small{display:block;margin-top:8px;font-size:14px;color:var(--ink);opacity:.85;text-shadow:var(--k-text-depth)}
.ops{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:14;display:flex;gap:10px;
  opacity:0;translate:0 20px;pointer-events:none;transition:opacity 520ms cubic-bezier(.65,0,.35,1),translate 640ms cubic-bezier(.65,0,.35,1)}
body.orbit .ops{opacity:1;translate:0 0;pointer-events:auto}
.ops .k-btn{flex:1;min-height:56px;color:#FFF8EC;text-shadow:var(--k-text-depth-dark)}   /* they sit on the dimmed room */
.ops .k-primary{color:#E6FFEF}

/* ---------- one style frame, lifted out of the orbit and opened large ---------- */
.liftdim{position:fixed;inset:0;z-index:12;background:rgba(36,24,10,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none}
body.lifted .liftdim{pointer-events:auto}
.lift{position:fixed;left:0;top:0;z-index:13;overflow:hidden;opacity:0;pointer-events:none;transform-origin:0 0;will-change:transform;
  background:#1a130b;box-shadow:0 0 0 2px #F6DFA9,0 0 0 4px rgba(184,137,62,.85),0 30px 70px rgba(30,18,5,.55)}
body.lifted .lift{pointer-events:auto}
.lift video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:0 0;will-change:transform;pointer-events:none}
.lifthint{position:fixed;left:0;right:0;z-index:13;text-align:center;font-size:12px;color:#FFF3DF;text-shadow:var(--k-text-depth-dark);opacity:0;pointer-events:none}

/* the arch, tapped: walk up to it */
.back{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:9;min-height:46px;padding:0 18px;font-size:15px;opacity:0;pointer-events:none;transition:opacity 300ms}
body.zoomed .back{opacity:1;pointer-events:auto}

/* what a touch would open (mock) — rises and fades in, eased at both ends (원칙 9) */
.sheet{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:9;padding:18px 18px 16px;border-radius:26px;
  background:var(--k-face);-webkit-backdrop-filter:blur(calc(var(--k-blur) + 10px)) saturate(150%);backdrop-filter:blur(calc(var(--k-blur) + 10px)) saturate(150%);box-shadow:var(--k-light),0 18px 50px rgba(90,60,20,.18);
  translate:0 130%;opacity:0;transition:translate 620ms cubic-bezier(.65,0,.35,1),opacity 480ms cubic-bezier(.65,0,.35,1)}
.sheet.on{translate:0 0;opacity:1}
.sheet h3{font-family:HHTitle,cursive;font-weight:400;font-size:40px;color:#D9AE62;line-height:1.1;text-shadow:var(--k-title-depth)}
.sheet p{margin-top:8px;font-size:15px;line-height:1.55;text-shadow:var(--k-text-depth)}
.sheet .k-btn{margin-top:14px;width:100%}
@media (prefers-reduced-motion:reduce){.sheet,.ops{transition:none}}
</style>
</head>
<body>
<header class="brand"><b>Her Hours</b><small>SHORTS</small><p>그녀의 방에서, 사진과 노래 하나로</p></header>

<div class="world" id="world">
  <img class="bg" src="room.jpg" alt="">
  <div class="beam"></div><div class="shade"></div>
  <div class="motes" id="motes"></div>
  <div class="screen" id="screen"><video id="v1" src="looks/look_halloween.mp4" autoplay muted loop playsinline></video><video id="v2" class="out" muted loop playsinline></video></div>
  <button class="spot l" data-k="style" style="--x:90.5%;--y:37%"><span class="tag" style="--bt:5.2s;--bd:-1s"><small>STYLE</small><b>스타일</b></span></button>
  <button class="spot l" data-k="photo" style="--x:93%;--y:50%"><span class="tag" style="--bt:4.6s;--bd:-3s"><small>PHOTOS</small><b>사진</b></span></button>
  <button class="spot r" data-k="song" style="--x:8.5%;--y:56%"><span class="tag" style="--bt:5.8s;--bd:-2s"><small>SONG</small><b>노래</b></span></button>
  <button class="spot d" data-k="words" style="--x:77%;--y:57%"><span class="tag" style="--bt:4.9s;--bd:-4s"><small>WORDS</small><b>글자</b></span></button>
  <button class="spot d" data-k="make" style="--x:44%;--y:75.5%;--s:72px"><span class="tag" style="--bt:5.5s;--bd:-.5s"><small>LIGHT IT</small><b>쇼츠 만들기</b></span></button>
  <div class="dim" id="dim"></div>
  <div class="orbit" id="orbit"></div>
</div>
<div class="cap" id="cap"><b id="capT">Halloween</b><small id="capS">밀어서 돌리고, 앞에 온 걸 눌러 크게 봐요</small></div>
<div class="touchlight" id="tl"></div>
<div class="liftdim" id="liftdim"></div>
<div class="lift" id="lift"><video id="lv" muted loop playsinline></video></div>
<p class="lifthint" id="lifthint">두 손가락으로 벌려 확대 · 아래로 끌어 내려놓기</p>
<div class="ops"><button class="k-btn" id="cancel">그대로 두기</button><button class="k-btn k-primary" id="pick">이 스타일로</button></div>
<button class="back k-btn" id="back">← 방으로</button>
<div class="sheet" id="sheet"><h3 id="sh"></h3><p id="sp"></p><button class="k-btn" id="sx">닫기</button></div>

<script>
const LOOKS = [
  ['halloween', 'Halloween', '아치 창문 · 박쥐와 불티'], ['windowband', 'Window Band', '창문 띠 · 가사가 박자에 켜짐'],
  ['triptych', 'Triptych', '3단 컷 · 박자마다 끊김'], ['pulse', 'Pulse', '음악에 반응하는 링'],
  ['lyricbloom', 'Lyric Bloom', '가사가 화면을 채움'], ['blackcut-room', 'Black Cut · 실내', '검은 컷 · 화면 전체가 움직임'],
  ['blackcut-road', 'Black Cut · 길 위', '낱말이 하나씩'], ['clockface-day', 'Clockface · 하루', '영상 한 편에 하루'],
  ['clockface-night', 'Clockface · 밤', '가사가 시계 자리에'],
];
// 영샘's glass knobs from the kit page (kit.html) - same browser, same setting
try { const k = JSON.parse(localStorage.getItem('hh-kit') || '{}'); if (k.fill != null) document.documentElement.style.setProperty('--k-fill', k.fill); if (k.blur != null) document.documentElement.style.setProperty('--k-blur', k.blur + 'px'); } catch {}
const $ = (id) => document.getElementById(id);
const world = $('world'), orbit = $('orbit'), body = document.body, lift = $('lift'), lv = $('lv');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = LOOKS.length, STEP = Math.PI * 2 / N, TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
// apple-design rubber band: the further past the edge, the less it follows
const rubber = (over, dim, c = .55) => (over * dim * c) / (dim + c * Math.abs(over));
// one critically damped spring step (no bounce); k ~ 170 = settles in ~0.35s
function spring(o, key, target, dt, k = 170) {
  const v = key + 'V'; o[v] = (o[v] || 0) + (-(o[key] - target) * k - (o[v] || 0) * 2 * Math.sqrt(k)) * dt; o[key] += o[v] * dt;
}

// sun motes in the window light
for (let i = 0; i < 22; i++) {
  const m = document.createElement('i'), d = 2 + Math.random() * 4;
  m.style.cssText = `left:${45 + Math.random() * 50}%;top:${30 + Math.random() * 55}%;--d:${d}px;--t:${9 + Math.random() * 9}s;--dl:${-Math.random() * 16}s;--mx:${-30 - Math.random() * 50}px;--my:${-40 - Math.random() * 70}px`;
  $('motes').append(m);
}

// ---- the arch plays a look; two videos cross-fade so a change never flashes white
let live = $('v1'), spare = $('v2');
function playLook(i) {
  const src = `looks/look_${LOOKS[i][0]}.mp4`;
  if (live.getAttribute('src') === src) return;
  spare.src = src; spare.currentTime = 0; spare.play().catch(() => {});
  spare.onplaying = () => { spare.classList.remove('out'); live.classList.add('out'); [live, spare] = [spare, live]; spare.onplaying = null; };
}

/* =================================== the camera (the room) =================================== */
const cam = { x: 0, y: 0, s: 1, tx: 0, ty: 0, ts: 1, held: false };
const geo = () => { const W = world.offsetWidth, H = world.offsetHeight, vw = innerWidth, vh = innerHeight; return { W, H, vw, vh, cx: vw / 2, cy: vh - H / 2 }; };
function bounds(s) {
  const { W, H, vw, vh } = geo();
  const hx = Math.max(0, (W * s - vw) / 2), yMin = H * (1 - s) / 2, yMax = Math.max(yMin, H * s / 2 + H / 2 - vh);
  return { xMin: -hx, xMax: hx, yMin, yMax };
}
// keep the point under the fingers under the fingers: screen = C + T + s * local
function zoomAbout(s, fx, fy, s0, x0, y0) {
  const g = geo(); const lx = (fx - g.cx - x0) / s0, ly = (fy - g.cy - y0) / s0;
  return { x: fx - g.cx - s * lx, y: fy - g.cy - s * ly };
}
function settleCam() {   // after a gesture: inside the limits, no bounce
  cam.ts = clamp(cam.ts, 1, 3.2); if (cam.ts < 1.06) { cam.ts = 1; cam.tx = 0; cam.ty = 0; }
  const b = bounds(cam.ts); cam.tx = clamp(cam.tx, b.xMin, b.xMax); cam.ty = clamp(cam.ty, b.yMin, b.yMax);
}
// 10-22 영샘 원칙 9 "가속·감속, 역할에 따라 빠르게 · 때로는 극도로 천천히": a move the app makes on its own (not under a
// finger) is an ease-in-out glide with its own pace; a finger can interrupt it at any frame and takes it from where it is
const easeIO = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function camTo(s, x, y, dur) {
  if (reduce) dur = 1;
  cam.anim = { t0: performance.now(), dur, s0: cam.s, x0: cam.x, y0: cam.y, s1: s, x1: x, y1: y };
  cam.ts = s; cam.tx = x; cam.ty = y; cam.sV = cam.xV = cam.yV = 0;
}
const home = (dur = 950) => camTo(1, 0, 0, dur);
function walkToArch() {   // tap the arch: walk up to it - slowly, like stepping closer
  const g = geo(), s = Math.min(2.4, (g.vh * .78) / (g.H * .413));
  const ox = (.503 - .5) * g.W, oy = (.2575 - .5) * g.H;
  camTo(s, g.vw / 2 - g.cx - s * ox, g.vh * .5 - g.cy - s * oy, 1300);
}

/* =================================== life: breathing + depth =================================== */
const par = { x: 0, y: 0, tx: 0, ty: 0 };       // parallax input (finger / tilt), springs toward t
let ambW = 1, lastTouch = -1e9;                  // breathing fades out while touched, back after a pause
// Android gives the tilt freely; an iPhone would need a permission prompt, so the finger alone drives it there
if (!reduce && 'DeviceOrientationEvent' in window && typeof DeviceOrientationEvent.requestPermission !== 'function') {
  addEventListener('deviceorientation', (e) => {
    if (e.gamma == null) return;
    if (performance.now() - lastTouch < 1500) return;

}

/* =================================== the orbit =================================== */
let current = 0;
const orb = { a: 0, ta: 0, appear: 0, tappear: 0, held: false, idle: 0 };
const cards = LOOKS.map(([id]) => { const c = document.createElement('button'); c.className = 'card'; c.style.backgroundImage = `url(looks/look_${id}.jpg)`; orbit.append(c); return c; });
const frontOf = (a) => ((Math.round(a / STEP) % N) + N) % N;
function layoutOrbit(t) {
  const W = world.offsetWidth; orbit.style.setProperty('--W', W + 'px');
  const R = W * .43, ap = easeIO(orb.appear);
  cards.forEach((c, i) => {
    const th = i * STEP - orb.a, x = Math.sin(th) * R, z = Math.cos(th);
    const y = W * (.06 + .42 * z);
    const wob = reduce ? 0 : Math.sin(t * 1.1 + i * 1.7) * 3, rz = reduce ? 0 : Math.sin(t * .8 + i) * 1.2;   // each frame floats on its own
    const s = (.62 + .38 * (z + 1) / 2) * (.6 + .4 * ap);
    const hidden = lifted && i === liftI;
    c.style.transform = `translate(${x * ap}px, ${(y + wob) * ap}px) scale(${s}) rotateY(${(-th * 40 / Math.PI).toFixed(1)}deg) rotateZ(${rz.toFixed(2)}deg)`;
    c.style.opacity = hidden ? 0 : (ap * (z > -.2 ? 1 : .55 + .45 * (z + 1) / .8)).toFixed(3);
    c.style.zIndex = z > 0 ? 7 + Math.round(z * 10) : 1;

}
let shown = -1;
function frontChanged(f) {
  if (f === shown) return; shown = f;
  $('capT').textContent = LOOKS[f][1]; $('capS').textContent = LOOKS[f][2];
  clearTimeout(frontChanged.t); frontChanged.t = setTimeout(() => playLook(f), 140);
}
function openOrbit() { body.classList.add('orbit'); orb.a = orb.ta = current * STEP; orb.aV = 0; orb.idle = 0; orb.tappear = 1; shown = -1; }
function closeOrbit(keep) {

}

/* =================================== the lifted frame =================================== */
let lifted = false, liftI = 0;
const lf = { p: 0, tp: 0, dx: 0, dy: 0, z: 1, zx: 0, zy: 0, tz: 1, tzx: 0, tzy: 0, held: false };
let lStart = null;
function liftEnd() { const vw = innerWidth, vh = innerHeight, w = Math.min(vw * .76, vh * .68 * 9 / 16), h = w * 16 / 9; return { x: (vw - w) / 2, y: (vh - h) / 2 - 24, w, h }; }
function openLift(i) {
  liftI = i; lifted = true; body.classList.add('lifted');
  const r = cards[i].getBoundingClientRect(); lStart = { x: r.left, y: r.top, w: r.width, h: r.height };
  const e = liftEnd(); lift.style.width = e.w + 'px'; lift.style.height = e.h + 'px';
  lv.src = `looks/look_${LOOKS[i][0]}.mp4`; lv.currentTime = 0; lv.play().catch(() => {});
  Object.assign(lf, { p: 0, pV: 0, tp: 1, dx: 0, dy: 0, dxV: 0, dyV: 0, z: 1, tz: 1, zx: 0, zy: 0, tzx: 0, tzy: 0 });
}
function closeLift(instant) { lf.tp = 0; if (instant) lf.p = 0; }
function renderLift() {
  if (!lStart) return;

  const k = lerp(lStart.w / e.w, 1, p) * (1 - drag * .35);
  const x = lerp(lStart.x, e.x, p) + lf.dx + e.w * (1 - k) / 2 * (p > 0 ? 1 : 0) * 0;
  const y = lerp(lStart.y, e.y, p) + lf.dy;
  lift.style.transform = `translate(${x + (e.w - e.w * k) / 2 * p}px, ${y}px) scale(${k})`;
  lift.style.borderRadius = `${16 / k}px`;
  lift.style.opacity = p > .01 ? 1 : 0;
  $('liftdim').style.opacity = (p * (1 - drag)).toFixed(3);
  const hint = $('lifthint'); hint.style.top = (e.y + e.h + 14) + 'px'; hint.style.opacity = (p * (1 - drag * 2) * (lf.z < 1.05 ? 1 : 0)).toFixed(3);
  lv.style.transform = `translate(${lf.zx}px, ${lf.zy}px) scale(${lf.z})`;
  if (lf.tp === 0 && lf.p < .01) { lifted = false; lStart = null; body.classList.remove('lifted'); lift.style.opacity = 0; lv.pause(); }
}

/* =================================== the light under the finger =================================== */
// it blooms quickly where the finger lands (~0.25s), trails it softly, and after the finger lifts it lingers and fades
// slowly (~1.8s) - fast for what answers the hand, extremely slow for what is left behind (원칙 9 · 11)
const tl = { x: innerWidth / 2, y: innerHeight * .6, tx: innerWidth / 2, ty: innerHeight * .6, o: 0, on: false }, tlEl = $('tl');
function renderTouchLight(dt) {
  spring(tl, 'x', tl.tx, dt, 90); spring(tl, 'y', tl.ty, dt, 90);
  tl.o = clamp(tl.o + (tl.on ? dt / .25 : -dt / 1.8), 0, 1);
  const e = easeIO(tl.o);
  tlEl.style.opacity = (e * (reduce ? 0 : 1)).toFixed(3);
  tlEl.style.transform = `translate(${tl.x.toFixed(1)}px, ${tl.y.toFixed(1)}px) scale(${(.75 + .25 * e).toFixed(3)})`;
}

/* =================================== one loop for everything =================================== */
let prev = performance.now();
function frame(now) {

    cam.s = lerp(a.s0, a.s1, e); cam.x = lerp(a.x0, a.x1, e); cam.y = lerp(a.y0, a.y1, e); if (k >= 1) cam.anim = null;
  } else if (!cam.held) { spring(cam, 'x', cam.tx, dt); spring(cam, 'y', cam.ty, dt); spring(cam, 's', cam.ts, dt); }

  // breathing: a slow drift and swell, fading out under the finger
  ambW += ((performance.now() - lastTouch > 1400 ? 1 : 0) - ambW) * (dt * 1.5);
  const aw = reduce ? 0 : ambW;
  const ax = (Math.sin(t * .23) * 5 + Math.sin(t * .11 + 1) * 3) * aw, ay = (Math.cos(t * .17) * 3 + Math.sin(t * .07) * 2) * aw, as = Math.sin(t * .09) * .008 * aw;
  if (!reduce) { spring(par, 'x', par.tx, dt, 60); spring(par, 'y', par.ty, dt, 60); }
  // depth: wall far (moves least), arch nearer, the names nearest
  world.style.transform = `translate(${cam.x + ax + par.x * .5}px, ${cam.y + ay + par.y * .5}px) scale(${cam.s * (1 + as)})`;
  world.style.setProperty('--sx', `${(par.x * .5 + ax * .4).toFixed(2)}px`); world.style.setProperty('--sy', `${(par.y * .5 + ay * .4).toFixed(2)}px`);
  world.style.setProperty('--px', `${(par.x * 1.1 + ax * .8).toFixed(2)}px`); world.style.setProperty('--py', `${(par.y * 1.1 + ay * .8).toFixed(2)}px`);
  document.querySelector('.brand').style.cssText += `;--bx:${(-par.x * .25).toFixed(2)}px;--by:${(-par.y * .2).toFixed(2)}px`;
  // orbit
  if (orb.appear > .001 || orb.tappear) {
    if (!orb.held) {
      spring(orb, 'a', orb.ta, dt, 120);
      if (orb.tappear && !lifted && Math.abs(orb.a - orb.ta) < .001 && Math.abs(orb.aV || 0) < .002 && !reduce && ++orb.idle > 160) { orb.ta += STEP; orb.idle = 0; }
    }
    // the frames rise in ~0.8s and settle back in ~0.6s, eased at both ends (layoutOrbit eases the raw progress)
    orb.appear = reduce ? orb.tappear : clamp(orb.appear + Math.sign(orb.tappear - orb.appear) * dt / (orb.tappear ? .8 : .6), 0, 1);
    layoutOrbit(t); frontChanged(frontOf(orb.a));

  }

  if (lifted) {
    if (!lf.held) { spring(lf, 'p', lf.tp, dt, 150); spring(lf, 'dx', 0, dt); spring(lf, 'dy', 0, dt); spring(lf, 'z', lf.tz, dt); spring(lf, 'zx', lf.tzx, dt); spring(lf, 'zy', lf.tzy, dt); }

requestAnimationFrame(frame);

/* =================================== touch =================================== */
const pts = new Map();          // pointerId -> {x,y}
let g = null;                   // the gesture in progress
let suppressClick = false, lastTap = { t: 0, x: 0, y: 0 };
const hist = [];                // recent finger samples for release speed
const speed = () => { const n = performance.now(); while (hist.length > 2 && n - hist[0].t > 90) hist.shift(); if (hist.length < 2) return { vx: 0, vy: 0 };
  const a = hist[0], b = hist[hist.length - 1], d = Math.max(16, b.t - a.t); return { vx: (b.x - a.x) / d * 1000, vy: (b.y - a.y) / d * 1000 }; };
const two = () => { const [a, b] = [...pts.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; };

addEventListener('pointerdown', (e) => {
  lastTouch = performance.now();
  if (pts.size === 0) { tl.tx = e.clientX; tl.ty = e.clientY; if (tl.o < .05) { tl.x = e.clientX; tl.y = e.clientY; } } tl.on = true;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); hist.length = 0; hist.push({ x: e.clientX, y: e.clientY, t: performance.now() });
  if ($('sheet').classList.contains('on') && !e.target.closest('.sheet')) { $('sheet').classList.remove('on'); g = { kind: 'none' }; return; }
  if (e.target.closest('.ops,.sheet,.back')) { g = { kind: 'none' }; return; }
  if (pts.size === 1) suppressClick = false;
  const inLift = lifted && (e.target === lift || e.target === $('liftdim'));
  if (lifted) {
    if (pts.size === 2) { const q = two(); g = { kind: 'lpinch', d0: q.d, z0: lf.z, x0: lf.zx, y0: lf.zy, mx0: q.mx, my0: q.my }; lf.held = true; return; }
    g = { kind: 'lift', x0: e.clientX, y0: e.clientY, onLift: e.target === lift, zx0: lf.zx, zy0: lf.zy, moved: 0 }; lf.held = true; return;
  }
  if (body.classList.contains('orbit')) {
    if (e.target.closest('.card') || e.target === $('dim')) { g = { kind: 'orbit', x0: e.clientX, last: e.clientX, moved: 0, card: e.target.closest('.card') }; orb.held = true; orb.idle = 0; }
    else g = { kind: 'none' };
    return;
  }

  if (pts.size === 2) { const q = two(); g = { kind: 'pinch', d0: q.d, s0: cam.s, x0: cam.x, y0: cam.y, mx0: q.mx, my0: q.my }; cam.held = true; suppressClick = true; return; }
  g = { kind: 'pan', x0: e.clientX, y0: e.clientY, cx0: cam.x, cy0: cam.y, moved: 0, onSpot: !!e.target.closest('.spot,.screen') };
  cam.held = true; cam.tx = cam.x; cam.ty = cam.y; cam.ts = cam.s;
}, { passive: true });

addEventListener('pointermove', (e) => {
  if (!pts.has(e.pointerId)) {      // a mouse just passing: let the room lean toward it a little
    if (!reduce && e.pointerType === 'mouse' && !g) { par.tx = (e.clientX / innerWidth - .5) * -16; par.ty = (e.clientY / innerHeight - .5) * -12; }
    return;
  }
  lastTouch = performance.now();
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); hist.push({ x: e.clientX, y: e.clientY, t: performance.now() });
  { const q = [...pts.values()]; tl.tx = q.reduce((a, p) => a + p.x, 0) / q.length; tl.ty = q.reduce((a, p) => a + p.y, 0) / q.length; }
  if (!g) return;
  if (g.kind === 'pinch' && pts.size === 2) {
    const q = two(); let s = g.s0 * q.d / g.d0;
    if (s > 3.2) s = 3.2 + rubber(s - 3.2, 3, .3); if (s < 1) s = 1 - rubber(1 - s, 1, .3) * .6;     // resists past the ends
    const p = zoomAbout(s, g.mx0, g.my0, g.s0, g.x0, g.y0);
    cam.s = s; cam.x = p.x + (q.mx - g.mx0); cam.y = p.y + (q.my - g.my0);
  } else if (g.kind === 'pan' && pts.size === 1) {
    const dx = e.clientX - g.x0, dy = e.clientY - g.y0; g.moved = Math.max(g.moved, Math.hypot(dx, dy));
    if (g.moved > 8) suppressClick = true;
    const b = bounds(cam.s); let x = g.cx0 + dx, y = g.cy0 + dy;

    const vw = innerWidth, vh = innerHeight;
    if (x > b.xMax) x = b.xMax + rubber(x - b.xMax, vw, .35); if (x < b.xMin) x = b.xMin - rubber(b.xMin - x, vw, .35);
    if (y > b.yMax) y = b.yMax + rubber(y - b.yMax, vh, .35); if (y < b.yMin) y = b.yMin - rubber(b.yMin - y, vh, .35);
    cam.x = x; cam.y = y;
    par.tx = clamp(dx * .05, -12, 12); par.ty = clamp(dy * .05, -10, 10);   // the near layers lean with the finger
  } else if (g.kind === 'orbit') {
    const dx = e.clientX - g.last; g.last = e.clientX; g.moved = Math.max(g.moved, Math.abs(e.clientX - g.x0));
    orb.a -= dx / (world.offsetWidth * .43); orb.ta = orb.a;
  } else if (g.kind === 'lpinch' && pts.size === 2) {
    const q = two(); let z = g.z0 * q.d / g.d0; if (z > 4) z = 4 + rubber(z - 4, 4, .3); if (z < 1) z = 1 - rubber(1 - z, 1, .3) * .5;
    const r = lift.getBoundingClientRect(), k = r.width / lift.offsetWidth;          // the frame's own scale on screen

    lf.z = z; lf.zx = fx - (fx - g.x0) * z / g.z0 + (q.mx - g.mx0) / k; lf.zy = fy - (fy - g.y0) * z / g.z0 + (q.my - g.my0) / k;

    if (lf.z > 1.05) { lf.zx = g.zx0 + dx; lf.zy = g.zy0 + dy; }                       // zoomed in: look around inside the frame
    else { lf.dx = dx * .9; lf.dy = dy > 0 ? dy : -rubber(-dy, innerHeight, .4); }    // not zoomed: drag it (down to put it back)
  }
}, { passive: true });

function end(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId); if (!pts.size) tl.on = false;
  const v = speed();
  if (!g) return;
  if (g.kind === 'pinch') {
    if (pts.size === 1) {     // one finger stays: carry on as a pan from here
      const [p] = [...pts.values()]; g = { kind: 'pan', x0: p.x, y0: p.y, cx0: cam.x, cy0: cam.y, moved: 99 }; return;
    }
    cam.held = false; cam.ts = cam.s; cam.tx = cam.x; cam.ty = cam.y; settleCam(); g = null; return;
  }
  if (g.kind === 'pan') {
    cam.held = false;
    if (g.moved <= 8) {         // a tap - the room's things get their click; on bare room, two taps zoom
      const n = performance.now();
      if (!g.onSpot && n - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
        if (cam.ts > 1.3) home(650);
        else { const p = zoomAbout(2.2, e.clientX, e.clientY, cam.s, cam.x, cam.y); const b = bounds(2.2); camTo(2.2, clamp(p.x, b.xMin, b.xMax), clamp(p.y, b.yMin, b.yMax), 650); }
        lastTap.t = 0;

    cam.xV = v.vx; cam.yV = v.vy;

    cam.ts = cam.s; settleCam(); par.tx = 0; par.ty = 0; g = null; return;
  }
  if (g.kind === 'orbit') {
    orb.held = false;
    if (g.moved < 10) {
      if (g.card) {
        const i = cards.indexOf(g.card);
        if (i === frontOf(orb.a)) openLift(i);                       // the front frame: lift it out
        else { const d = ((i * STEP - orb.a) % TAU + 3 * Math.PI) % TAU - Math.PI; orb.ta = orb.a + d; orb.aV = 0; }
      } else closeOrbit(false);
    } else {
      const va = -v.vx / (world.offsetWidth * .43);
      orb.ta = Math.round((orb.a + va * .998 / (1 - .998) / 1000) / STEP) * STEP; orb.aV = va;
    }

  }

    lf.tz = clamp(lf.z, 1, 4); lf.tzx = lf.zx; lf.tzy = lf.zy;
    if (pts.size === 1) { const [p] = [...pts.values()]; g = { kind: 'lift', x0: p.x, y0: p.y, zx0: lf.zx, zy0: lf.zy, moved: 99 }; return; }
    lf.held = false; if (lf.tz < 1.08) { lf.tz = 1; lf.tzx = 0; lf.tzy = 0; } else { lf.tzx = lf.zx; lf.tzy = lf.zy; } g = null; return;
  }
  if (g.kind === 'lift') {
    lf.held = false;
    if (g.moved <= 8) {
      const n = performance.now();
      if (g.onLift && n - lastTap.t < 320) { if (lf.tz > 1.1) { lf.tz = 1; lf.tzx = 0; lf.tzy = 0; } else { const r = lift.getBoundingClientRect(), k = r.width / lift.offsetWidth; const fx = (e.clientX - r.left) / k, fy = (e.clientY - r.top) / k; lf.tz = 2.4; lf.tzx = fx - fx * 2.4; lf.tzy = fy - fy * 2.4; } lastTap.t = 0; }
      else { lastTap = { t: n, x: e.clientX, y: e.clientY }; if (!g.onLift) closeLift(); }
    } else if (lf.z > 1.05) { lf.tz = clamp(lf.z, 1, 4); lf.tzx = lf.zx + v.vx * .15; lf.tzy = lf.zy + v.vy * .15; lf.zxV = v.vx; lf.zyV = v.vy; }
    else if (lf.dy > innerHeight * .16 || v.vy > 700) { lf.dyV = v.vy; closeLift(); }            // pulled down: back into the orbit
    else { lf.dxV = v.vx; lf.dyV = v.vy; }                                                        // let go: it floats back
    g = null; return;

}
addEventListener('pointerup', end); addEventListener('pointercancel', end);

// a drag must not also count as a tap on whatever it started on
addEventListener('click', (e) => { if (suppressClick && !e.target.closest('.ops,.sheet,.back')) { e.stopPropagation(); e.preventDefault(); } suppressClick = false; }, true);

/* =================================== the room's things =================================== */
const SHEETS = {
  photo: ['Photographs', '벽의 사진 액자에서 내 사진·영상을 골라요. 고른 사진은 액자 속 영상에 바로 들어가요.'],
  song: ['Song', '턴테이블에 노래를 걸어요. 고르면 바로 흘러나오고, 아치 화면이 박자에 맞춰 움직여요.'],
  words: ['Words', '노트에 이름과 제목을 적어요. 영상 위에 그대로 써져요.'],
  make: ['Light it', '촛불을 켜면 쇼츠가 만들어져요. 촛불이 다 타오르면 완성 — 아치 속 영상이 완성본으로 바뀌어요.'],
};
document.addEventListener('pointerdown', (e) => { const b = e.target.closest('.spot,.k-btn'); if (b) { b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 160); } }, { passive: true });
document.querySelectorAll('.spot').forEach((b) => b.onclick = () => {
  const k = b.dataset.k;
  if (k === 'style') { home(700); return openOrbit(); }
  const [h, p] = SHEETS[k]; $('sh').textContent = h; $('sp').textContent = p; $('sheet').classList.add('on');
});
$('sx').onclick = () => $('sheet').classList.remove('on');
$('screen').onclick = () => { if (!body.classList.contains('orbit')) walkToArch(); };
$('back').onclick = () => home(1000);
$('pick').onclick = () => { if (lifted) { orb.ta = orb.a = liftI * STEP; closeLift(); } closeOrbit(true); };
$('cancel').onclick = () => closeOrbit(false);
addEventListener('resize', () => { if (lifted) { const e = liftEnd(); lift.style.width = e.w + 'px'; lift.style.height = e.h + 'px'; } settleCam(); });
</script>
