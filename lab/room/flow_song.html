<title>노래 화면 시안 — 그녀의 방</title>
<!-- 10-24 클로: 잠근 첫 화면·스타일·사진(flow_photos.html) 다음 = 노래. 조사 RESEARCH_step_screens §4 클로 추천 그대로 —
     위 턴테이블, 아래 원목 상자에 소매가 비스듬히 서 있다. 옆으로 넘기면 가운데 장만 똑바로 서고 나머지는 뒤로 기운다.
     소매를 누르면 판이 빠져나와 곡선을 그리며 턴테이블에 올라가고, 바늘이 내려가며 15초를 들려준다(앱 test/ 의 진짜 mp3).
     곡의 표지 색이 방 빛으로 번진다. 곡 표·파형·진행 막대·재생 버튼 줄 없음. 비교용 flow_photos.html 그대로. -->
<!-- 10-24 클로: 잠근 첫 화면·스타일(flow_style.html) 다음 = 사진. 조사 RESEARCH_step_screens §3 클로 추천 그대로 —
     흐린 벽에 살짝 기운 빈 폴라로이드 10장을 불규칙하게(꼭 채울 3장은 금테, 7장은 희미한 테 — '3/10 필수' 같은 말 대신 테가 말한다),
     빈 장을 누르면 폰 사진 선택기(앱 안 사진첩 격자 없음) → 고른 사진이 아래에서 곡선을 그리며 날아가 꽂히고 하얀빛에서 천천히 '현상'된다.
     꽂힌 장을 누르면 들리며 ✕. 시험용 '예시 사진으로 채워 보기'. 비교용 flow_style.html 그대로. -->
<!-- 10-24 클로: 잠근 입구 빛 첫 화면(flow_light.html) 다음 단계 = 스타일. 조사 RESEARCH_step_screens §2 클로 추천 그대로 —
     아치는 무대로 두고(방 안 진짜 아치 자리에 영상, 카메라와 같이 커짐) 옆으로 쓸면 금빛 선이 지나가며 룩만 바뀐다(잠금화면 방식),
     룩의 색이 니치와 벽으로 번진다. 룩 이름 금박 한 줄 + 작은 점 9개. 카드 줄·격자·슬라이더 없음. 비교용 flow_light.html 그대로. -->
<!-- 10-24 클로: flow.html 첫 화면 + 입구 빛(21st 2891 Spotlight reveal · 19257 Text Reveal, 영샘 10-24 입구 빛 "오 좋은데?").
     방은 불 꺼진 밤으로 열린다 → 손가락 닿는 자리만 따뜻하게 보인다 → 손을 떼거나 1초 머물면 그 자리부터 방에 불이 번진다('Light it')
     → 이름이 글자마다 올라오고 버튼이 차례로 뜬다 → 켜진 뒤엔 은은한 빛이 손을 따라오고, 가만두면 오른쪽 위 창(guide 의 빛 하나)으로 돌아간다.
     아무도 안 만지면 빛이 혼자 떠돌다 7초 뒤 스스로 켜진다. 비교용 원본 flow.html 그대로. -->

<!-- 10-22 밤 영샘 "첫 화면은 시작·내 영상·정보만, 시작 누르면 스타일 전체 화면, 다음 누르면 사진…" 첫 시안(클로, 영샘 의견 전).
     조사(RESEARCH_step_flow_20261022.md) 결론대로: 실시간 3D 말고 방 그림 위 2.5D 줌 — 단계마다 카메라가 방 안 그 물건으로 걸어 들어가고
     (아치 = 스타일 · 벽 액자 = 사진 · 턴테이블 = 노래 · 노트 = 글자 · 촛불 = 만들기), 방은 흐려져 뒤에 남는다. 금빛 실이 단계 표시.
     「다음」은 아래 전폭 유리 하나, 「뒤로」는 왼쪽 위 작게. 모션은 최고 성능 폰 기준(영샘 10-22). -->
<style>
:root{--ink:#3B2F22;--ink-2:#6E5F4B;--gold:#B8893E;--gold-hi:#E2B867;--mint:150 214 176;--io:cubic-bezier(.65,0,.35,1);--out:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#E9DCC6;color:var(--ink);font:16px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
/* the room: one layer the camera moves over */
.cam{position:fixed;inset:0;overflow:hidden}
.room{position:absolute;left:50%;top:50%;width:max(100vw,calc(100dvh * 2 / 3));aspect-ratio:2/3;translate:-50% -50%;
  background:url(room.jpg) center/cover;transform-origin:0 0;will-change:transform,filter;
  transition:transform 1150ms var(--io),filter 900ms var(--io)}
body.step .room{filter:blur(7px) saturate(1.1) brightness(1.04)}
/* B (10-23 board): each stop blurs to a different colour (white arch, orange frames, olive candle) so the steps don't read as
   one house - a cream wash lit from the window evens them out while the room still shows through */
.wash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 900ms var(--io);
  background:radial-gradient(70% 45% at 88% 0%,rgb(255 251 240 / .75),transparent 70%),linear-gradient(180deg,rgb(251 244 232 / .78),rgb(246 236 220 / .62) 55%,rgb(236 222 200 / .55))}
html.veil body.step .wash{opacity:1}
.breath{position:absolute;inset:0;animation:breath 9s ease-in-out infinite alternate}
@keyframes breath{from{transform:scale(1)}to{transform:scale(1.025)}}
/* the gold thread across the room (home) */
.thread{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:1;transition:opacity 600ms}
.thread path{fill:none;stroke:rgba(255,236,190,.95);stroke-width:1.4;stroke-dasharray:1 7;stroke-linecap:round;vector-effect:non-scaling-stroke;animation:flow 6s linear infinite}
.thread path.glow{stroke:rgba(255,200,120,.4);stroke-width:5}
@keyframes flow{to{stroke-dashoffset:-64}}
.thread circle{fill:#FFF6DC;filter:drop-shadow(0 0 4px rgba(255,210,140,.95))}
body.step .thread{opacity:0}
/* glass */
.glass{background:linear-gradient(180deg,rgb(255 255 255 / .30),rgb(255 255 255 / .12) 55%,rgb(255 255 255 / .06));
  box-shadow:inset 0 1.5px 0 rgb(255 255 255 / .95),inset 0 0 0 1px rgb(255 255 255 / .6),inset 0 -10px 16px -8px rgb(255 255 255 / .45),0 10px 26px -8px rgb(60 40 15 / .28);
  -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
.mint{background:linear-gradient(180deg,rgb(var(--mint) / .55),rgb(var(--mint) / .28));color:#1F4630;box-shadow:inset 0 1.5px 0 #fff,inset 0 0 0 1px rgb(220 255 235 / .9),0 10px 26px -8px rgb(40 70 50 / .3),0 0 24px rgb(var(--mint) / .35)}
.press{transition:transform 380ms var(--out)}
.press:active,.press.down{transform:scale(.96);transition-duration:110ms}
.depth{text-shadow:0 -1px 0 rgb(255 255 255 / .55),0 1px 0 rgb(60 40 15 / .22),0 2px 2px rgb(60 40 15 / .16)}
/* home */
.home{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 22px);
  transition:opacity 500ms var(--io),translate 700ms var(--io)}
body.step .home{opacity:0;translate:0 30px;pointer-events:none}
.brand{font:400 30px/1 "Snell Roundhand","Apple Chancery",cursive,serif;color:var(--gold-hi);text-shadow:0 -1px 0 rgb(255 250 235 / .9),0 1px 0 #9A6F2E,0 3px 6px rgb(90 60 20 / .35)}
.head{margin-top:14px;font:italic 300 40px/1 Georgia,serif}
.head small{display:block;margin-top:10px;font:14px/1.4 -apple-system,"Apple SD Gothic Neo",sans-serif;font-style:normal;color:var(--ink-2)}
.start{width:100%;min-height:68px;border-radius:999px;font-size:20px;font-weight:800;letter-spacing:.04em}
.links{display:flex;justify-content:center;gap:12px;margin-top:12px}
.links button{border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700}
/* steps */
.stage{position:fixed;inset:0;pointer-events:none}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 0;display:flex;align-items:center;gap:10px;z-index:5;
  opacity:0;translate:0 -12px;transition:opacity 500ms var(--io) 300ms,translate 600ms var(--io) 300ms;pointer-events:none}
body.step .top{opacity:1;translate:0 0;pointer-events:auto}
.back{width:44px;height:44px;border-radius:50%;font-size:20px;flex:none}
.prog{flex:1;height:44px}
.prog path{fill:none;stroke:rgba(184,137,62,.35);stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round}
.prog path.lit{stroke:var(--gold-hi);stroke-dasharray:none;transition:stroke-dashoffset 900ms var(--io)}
.prog circle{fill:#F4E7CC;stroke:rgba(184,137,62,.6);stroke-width:1.5;transition:fill 500ms,r 500ms}
.prog circle.on{fill:#FFF3D6;stroke:var(--gold-hi);filter:drop-shadow(0 0 6px rgba(255,200,110,.95))}
.prog text{font:600 9px -apple-system,sans-serif;fill:var(--ink-2);letter-spacing:.06em}
.panel{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 70px);bottom:calc(env(safe-area-inset-bottom) + 100px);padding:0 18px;
  display:flex;flex-direction:column;opacity:0;translate:0 24px;scale:.98;pointer-events:none;transition:opacity 420ms var(--io),translate 600ms var(--out),scale 600ms var(--out)}
.panel.on{opacity:1;translate:0 0;scale:1;pointer-events:auto;transition-delay:520ms}
/* the room behind is bright (window light) - dark ink with a raised light lip, like kit.css type */
.panel h2{font:italic 300 40px/1 Georgia,serif;color:var(--ink);text-shadow:0 -1px 0 rgb(255 250 235 / .9),0 1px 0 rgb(90 60 20 / .25),0 3px 8px rgb(255 245 225 / .9)}
.panel p.k{margin:8px 0 14px;font-size:14px;font-weight:600;color:var(--ink-2);text-shadow:0 0 8px rgb(255 248 236 / .95),0 1px 0 rgb(255 255 255 / .8)}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;scrollbar-width:none;flex:1;align-items:center}
.rail::-webkit-scrollbar{display:none}
.look{flex:0 0 58%;scroll-snap-align:center;border-radius:22px;padding:8px;text-align:left}
.look img{display:block;width:100%;aspect-ratio:9/14;object-fit:cover;border-radius:16px}
.look b{display:block;margin:8px 4px 2px;font-size:15px}
.look.sel{box-shadow:0 0 0 3px var(--gold-hi),0 0 22px rgba(255,200,110,.6)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{aspect-ratio:3/4;border-radius:16px;display:grid;place-items:center;font-size:28px;color:#fff}
.songs{display:flex;flex-direction:column;gap:10px;overflow:auto}
.song{display:flex;align-items:center;gap:12px;border-radius:18px;padding:8px;text-align:left}
.song img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.song.sel{box-shadow:0 0 0 3px var(--gold-hi)}
.field{border-radius:18px;padding:14px 16px;margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.field input{width:100%;border:0;background:none;font:600 18px -apple-system,sans-serif;color:var(--ink);outline:none}
.candle{margin:auto;width:150px;height:150px;border-radius:50%;font-size:56px}
.next{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 22px);min-height:64px;border-radius:999px;font-size:18px;font-weight:800;z-index:5;
  opacity:0;translate:0 20px;pointer-events:none;transition:opacity 500ms var(--io) 400ms,translate 600ms var(--io) 400ms}
body.step .next{opacity:1;translate:0 0;pointer-events:auto}
.skip{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 4px);text-align:center;font-size:12px;font-weight:600;color:var(--ink-2);text-shadow:0 0 6px rgb(255 248 236 / .95);z-index:5;opacity:0;transition:opacity 400ms}
body.step .skip{opacity:.9}
.tag{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 6px);font-size:10px;color:var(--ink-2);opacity:.7;z-index:9}
@media (prefers-reduced-motion:reduce){.room,.panel,.home,.top,.next{transition-duration:1ms}.breath,.thread path{animation:none}}
/* entrance light (10-24): the canvas sits over the room, under the home; soft-light once the room is lit so it warms instead of washing */
#lamp{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity 700ms var(--io)}
#lamp.lit{mix-blend-mode:soft-light}
body.step #lamp{opacity:0}
.hint{position:fixed;left:0;right:0;top:46%;text-align:center;font:italic 400 15px/1 Georgia,serif;letter-spacing:.32em;color:rgb(255 232 190 / .62);
  text-shadow:0 0 12px rgb(255 190 110 / .35);pointer-events:none;transition:opacity 900ms var(--io);animation:hint 3.2s ease-in-out infinite alternate}
@keyframes hint{from{opacity:.35}to{opacity:.85}}
body.lit .hint,body.touched .hint{opacity:0!important;animation:none}
/* before the light: the home waits; after, each part rises in turn (the name itself is revealed letter by letter in script) */
body.dark .home .rise{opacity:0;translate:0 18px}
.home .rise{transition:opacity 900ms var(--out),translate 1100ms var(--out)}
body.dark .home{pointer-events:none}
/* style step (10-24): the arch in the room IS the screen - it lives inside .room at v3's .screen place, so it grows with the
   camera instead of floating over it as a card. Swiping wipes the next look across behind a gold seam (lock-screen style:
   the stage stays, only the look changes), and the look's own colour bleeds into the niche and the wall. */
@font-face{font-family:Josefin;src:url(fonts/JosefinSans-SemiBold.ttf);font-display:swap}
.screen{position:absolute;left:32.9%;top:5.1%;width:34.9%;height:41.3%;overflow:hidden;z-index:2;border-radius:50% 50% 6px 6px / 27% 27% 6px 6px;
  opacity:0;transition:opacity 700ms var(--io);
  box-shadow:0 0 0 1px rgba(240,214,160,.85),0 0 0 3px rgba(255,248,236,.35),0 10px 26px rgba(120,80,30,.28),0 0 40px rgba(255,236,200,.6)}
body.s0 .screen{opacity:1;transition-delay:450ms}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;z-index:1}
.screen video.top{z-index:2;clip-path:inset(0 0 0 100%)}
.screen::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(118deg,rgba(255,255,255,0) 30%,rgba(255,248,230,.20) 46%,rgba(255,255,255,0) 60%),linear-gradient(to bottom,rgba(255,226,170,.10),rgba(120,80,30,.12))}
.seam{position:absolute;top:-4%;bottom:-4%;left:0;width:1.5px;margin-left:-.75px;z-index:3;opacity:0;pointer-events:none;
  background:linear-gradient(180deg,transparent,#FFE7B0 18%,#fff 50%,#FFE7B0 82%,transparent);box-shadow:0 0 8px 1px rgba(255,214,140,.95),0 0 22px 5px rgba(255,200,120,.45)}
.glowvid{position:absolute;left:24%;top:-1%;width:52%;height:54%;z-index:1;pointer-events:none;opacity:0;mix-blend-mode:soft-light;transition:opacity 900ms var(--io)}
body.s0 .glowvid{opacity:.8}
.glowvid img{display:block;width:100%;height:100%;object-fit:cover;filter:blur(26px) saturate(1.3);transition:opacity 700ms var(--io)}
.tint{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;background-color:rgb(200 170 130);mix-blend-mode:soft-light;
  transition:background-color 1400ms var(--io),opacity 900ms var(--io);
  -webkit-mask-image:radial-gradient(62% 38% at 50% 27%,#000 35%,transparent 100%);mask-image:radial-gradient(62% 38% at 50% 27%,#000 35%,transparent 100%)}
body.s0 .tint{opacity:1}
/* soft-light alone barely showed on the cream wall (Window Band's blue read as nothing) - a second, hue-carrying layer underneath */
.tint2{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;background-color:rgb(200 170 130);mix-blend-mode:color;
  transition:background-color 1400ms var(--io),opacity 900ms var(--io);
  -webkit-mask-image:radial-gradient(46% 30% at 50% 26%,#000 20%,transparent 100%);mask-image:radial-gradient(46% 30% at 50% 26%,#000 20%,transparent 100%)}
body.s0 .tint2{opacity:.38}
body.s0 .room{filter:none}
.panel.on[data-step="0"]{pointer-events:none}
/* the look's name takes the title's place (the thread above already says STYLE); first try put it under the arch, on the sofa, where it vanished */
.lookname{padding-top:2px}
.lookname small{display:block;font:600 10px/1 Josefin,-apple-system,sans-serif;letter-spacing:.34em;color:var(--ink-2);text-shadow:0 0 8px rgb(255 248 236 / .95)}
.lookname b{display:block;margin:8px 0 12px;font:italic 400 34px/1.05 Georgia,serif;color:var(--gold);min-height:1.1em;
  text-shadow:0 -1px 0 rgb(255 250 235 / .95),0 1px 0 #7E5A22,0 3px 8px rgb(255 245 225 / .9)}
.dots{display:flex;gap:9px;pointer-events:auto;width:max-content}
.swipe{margin-top:auto;text-align:center;font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.02em;transition:opacity 700ms var(--io);
  text-shadow:0 0 10px rgb(255 248 236),0 0 18px rgb(255 248 236 / .9),0 1px 0 rgb(255 255 255 / .8)}
.swipe.gone{opacity:0}
/* photos step (10-24): empty polaroids pinned to the blurred wall, irregular (7). Three that must be filled carry a gold rim,
   the other seven are fainter - the rim says what '3 of 10 required' would have said. A chosen photo flies in on a curve and develops. */
.wall{position:relative;flex:1;margin-top:12px}
.pola{position:absolute;aspect-ratio:.84;padding:6% 6% 0;border-radius:3px;background:linear-gradient(180deg,#FFFDF8,#F4ECDD);transform:rotate(var(--r));
  box-shadow:inset 0 1px 0 rgb(255 255 255 / .9),0 10px 22px -8px rgb(60 40 15 / .45),0 2px 4px rgb(60 40 15 / .18);
  transition:transform 600ms var(--out),box-shadow 600ms var(--out),opacity 600ms;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.pola .ph{position:relative;width:100%;aspect-ratio:1;overflow:hidden;border-radius:1px;background:linear-gradient(160deg,#F2EDE4,#E4DBCC);box-shadow:inset 0 0 0 1px rgb(120 90 50 / .12)}
.pola .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pola .ph img.dev{animation:develop 3800ms cubic-bezier(.3,0,.2,1) forwards}
@keyframes develop{0%{filter:brightness(2.6) saturate(0) contrast(.55) blur(3px);opacity:.2}30%{opacity:.85}100%{filter:none;opacity:1}}
.pola .ph img.gone{transition:opacity 500ms,transform 500ms;opacity:0;transform:scale(1.06)}
.pola .pin{position:absolute;left:50%;top:-5px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFF1C9,#C9963F 60%,#8A5F22);box-shadow:0 2px 3px rgb(60 40 15 / .45)}
.pola .no{position:absolute;left:0;right:0;bottom:5%;text-align:center;font:italic 400 13px/1 Georgia,serif;color:rgb(160 120 55 / .75)}
.pola.req{box-shadow:0 0 0 1.5px var(--gold-hi),0 0 16px rgb(255 200 110 / .55),0 10px 22px -8px rgb(60 40 15 / .45)}
.pola.req .no{color:var(--gold)}
.pola:not(.req):not(.full){opacity:.66}
.pola.lift{transform:rotate(0deg) translateY(-8px) scale(1.14);z-index:3;box-shadow:0 0 0 1.5px rgb(255 255 255 / .9),0 22px 40px -10px rgb(60 40 15 / .5)}
.pola .x{position:absolute;right:-12px;top:-12px;width:30px;height:30px;border-radius:50%;font-size:12px;display:none;place-items:center;z-index:2}
.pola.lift .x{display:grid}
.pola.fly{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:1}
.demo{margin:4px auto 0;font-size:12px;font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-shadow:0 0 8px rgb(255 248 236)}
body.s1 .next:not(.ready){opacity:.5}
/* song step (10-24): the turntable above, a wooden crate of sleeves below. Contents are things (vinyl, sleeves, wood),
   only 「다음」/「뒤로」 stay glass (research: controls are glass, content is the room's objects). */
.songlight{position:fixed;inset:0;pointer-events:none;opacity:0;mix-blend-mode:soft-light;background:radial-gradient(85% 55% at 50% 32%,var(--sl,rgb(255 220 170)),transparent 75%);transition:opacity 1200ms var(--io)}
body.s2.playing .songlight{opacity:.95}
.deck{position:relative;width:min(72vw,300px);aspect-ratio:1;margin:16px auto 0;flex:none}
.mat{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,#3a332d 0 18%,#2b2520 19% 64%,#221d19 65% 100%);
  box-shadow:0 0 0 7px rgb(214 196 168 / .55),0 0 0 8px rgb(255 255 255 / .55),0 22px 44px -14px rgb(40 25 10 / .6)}
.vinyl{position:absolute;inset:3%;border-radius:50%;opacity:0;transform:scale(.9);transition:opacity 300ms,transform 300ms var(--out);
  background:repeating-radial-gradient(circle at 50% 50%,#121010 0 1.2px,#1d1a18 1.2px 2.6px);box-shadow:inset 0 0 0 2px #0c0b0a}
.vinyl.on{opacity:1;transform:none}
.vinyl.spin{animation:spin 1.8s linear infinite}
@keyframes spin{to{rotate:360deg}}
.vinyl .label{position:absolute;inset:34%;border-radius:50%;background:#C9A36A center/cover;box-shadow:0 0 0 2px rgb(0 0 0 / .35)}
.vinyl .label::after{content:"";position:absolute;left:50%;top:50%;width:7%;height:7%;margin:-3.5% 0 0 -3.5%;border-radius:50%;background:#E8DFD0;box-shadow:inset 0 1px 2px rgb(0 0 0 / .6)}
/* the light on a record doesn't turn with it - the sheen sits still above the spinning disc */
.sheen{position:absolute;inset:3%;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:conic-gradient(from 20deg,transparent 0 8%,rgb(255 245 225 / .16) 13%,transparent 20% 50%,rgb(255 245 225 / .12) 63%,transparent 70%)}
.arm{position:absolute;right:3%;top:1%;width:12px;height:66%;margin-right:-6px;transform-origin:6px 10px;transform:rotate(3deg);transition:transform 900ms cubic-bezier(.45,0,.2,1);z-index:2;pointer-events:none}
.arm::before{content:"";position:absolute;left:-5px;top:-1px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfc7bb 45%,#8d857a);box-shadow:0 3px 6px rgb(40 25 10 / .45)}
.arm i{position:absolute;left:4px;top:10px;bottom:10px;width:4px;border-radius:2px;background:linear-gradient(90deg,#9a9288,#f4efe7 45%,#a9a196);box-shadow:2px 3px 5px rgb(40 25 10 / .35)}
.arm::after{content:"";position:absolute;left:-1px;bottom:0;width:14px;height:20px;border-radius:2px 2px 3px 3px;background:linear-gradient(180deg,#e9e3da,#a39b90);box-shadow:2px 3px 5px rgb(40 25 10 / .4)}
.arm.down{transform:rotate(24deg)}
.crate{position:relative;margin-top:auto;height:178px;flex:none}
.sleeves{position:absolute;left:-18px;right:-18px;bottom:30px;height:170px;display:flex;align-items:flex-end;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  padding:0 calc(50% - 58px);scrollbar-width:none;perspective:700px;-webkit-overflow-scrolling:touch}
.sleeves::-webkit-scrollbar{display:none}
.sleeve{flex:0 0 116px;height:116px;margin:0 -16px;scroll-snap-align:center;border-radius:2px;background:#ccc center/cover;transform-origin:50% 100%;
  box-shadow:inset 0 0 0 1px rgb(255 255 255 / .25),0 -2px 10px rgb(40 25 10 / .25),0 12px 18px -10px rgb(40 25 10 / .5);will-change:transform;cursor:pointer}
.sleeve.empty{filter:brightness(.82) saturate(.7)}
.front{position:absolute;left:-6px;right:-6px;bottom:0;height:58px;border-radius:6px 6px 8px 8px;pointer-events:none;
  background:repeating-linear-gradient(92deg,rgb(255 255 255 / .05) 0 2px,transparent 2px 9px),linear-gradient(180deg,#C99A62,#A87A45 60%,#8E6435);
  box-shadow:inset 0 2px 0 rgb(255 230 190 / .7),inset 0 -6px 12px rgb(60 35 10 / .35),0 14px 26px -10px rgb(60 35 10 / .55)}

<script>
// the objects the camera walks into, in room-image % (room.jpg 1024x1536) — same places as v3's spots
const STOPS = [
  { name: 'STYLE', x: 50.35, y: 25.75, s: 2.3, fit: true, at: .52 },   // the arch window - sized to fit between the name above and 「다음」 below
  { name: 'PHOTOS', x: 88, y: 44, s: 2.6 },    // frames on the right wall
  { name: 'SONG', x: 11, y: 56, s: 2.6 },      // the turntable
  { name: 'WORDS', x: 76, y: 59, s: 2.8 },     // the notebook on the sofa
  { name: 'LIGHT', x: 44, y: 75, s: 2.6 },     // the candle on the ottoman
];
const room = document.getElementById('room'), body = document.body, panels = [...document.querySelectorAll('.panel')];
let step = -1;
function aim(i) {
  if (i < 0) { room.style.transform = ''; return; }
  const W = room.offsetWidth, H = room.offsetHeight, p = STOPS[i];
  // room is centred by translate(-50%,-50%); move the stop to the screen centre, then scale about it
  const px = p.x / 100 * W, py = p.y / 100 * H;
  // the arch screen is 34.9% x 41.3% of the room: scale so it takes ~80% of the width but never more than 60% of the height
  const s = p.fit ? Math.min(innerWidth * .78 / (W * .349), innerHeight * .54 / (H * .413)) : p.s, dy = ((p.at || .5) - .5) * innerHeight;
  room.style.transform = `translate(${W / 2 - px * s}px, ${H / 2 - py * s + dy}px) scale(${s})`;
}
function go(i) {
  step = Math.max(-1, Math.min(STOPS.length - 1, i));
  body.classList.toggle('step', step >= 0);
  aim(step);
  panels.forEach((p) => p.classList.toggle('on', +p.dataset.step === step));
  document.getElementById('next').textContent = step === STOPS.length - 1 ? '만들기' : '다음';
  drawProg();
  body.classList.toggle('s0', step === 0);
  window.styleStep && window.styleStep(step === 0);
  body.classList.toggle('s1', step === 1);
  body.classList.toggle('s2', step === 2); window.songStep && window.songStep(step === 2);
}
// the gold thread on the home room, through the five stops
const d = 'M' + STOPS.map((p) => `${p.x} ${p.y * 1.5 / 1.5 * 1}`).join(' L ');
const curve = STOPS.reduce((acc, p, k) => acc + (k ? ` Q ${(STOPS[k - 1].x + p.x) / 2 + (k % 2 ? 14 : -14)} ${(STOPS[k - 1].y + p.y) / 2 * 1.5}, ${p.x} ${p.y * 1.5}` : `M ${p.x} ${p.y * 1.5}`), '');
document.getElementById('tg').setAttribute('d', curve); document.getElementById('tp').setAttribute('d', curve);
const thread = document.querySelector('.thread');
STOPS.forEach((p) => { const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); c.setAttribute('cx', p.x); c.setAttribute('cy', p.y * 1.5); c.setAttribute('r', 1.1); thread.append(c); });
// the progress: the same thread, straightened along the top, five beads
function drawProg() {
  const svg = document.getElementById('prog'), xs = STOPS.map((_, k) => 14 + k * (272 / 4));
  let path = `M ${xs[0]} 16`; for (let k = 1; k < xs.length; k++) path += ` Q ${(xs[k - 1] + xs[k]) / 2} ${k % 2 ? 6 : 26}, ${xs[k]} 16`;
  const lit = step >= 0 ? xs[step] : xs[0];
  svg.innerHTML = `<path d="${path}"/><clipPath id="cl"><rect x="0" y="0" width="${lit + 1}" height="44"/></clipPath><path class="lit" d="${path}" clip-path="url(#cl)"/>` +
    xs.map((x, k) => `<circle cx="${x}" cy="16" r="${k === step ? 6 : 4.5}" class="${k <= step ? 'on' : ''}"/><text x="${x}" y="40" text-anchor="middle">${STOPS[k].name}</text>`).join('');
}
// content
const LOOKS = [['halloween', 'Halloween'], ['windowband', 'Window Band'], ['triptych', 'Triptych'], ['pulse', 'Pulse'], ['lyricbloom', 'Lyric Bloom'],
  ['blackcut-room', 'Black Cut'], ['blackcut-road', 'Black Cut, the road'], ['clockface-day', 'Clockface, a day'], ['clockface-night', 'Clockface, a night']];
// the records in the crate: cover, title, who sings, and the app's own mp3 (test/ build, same site)
const SONGS = [['hw_eira_wind_me_up', 'Wind Me Up Till Midnight', 'Eira'], ['hw_violet_one_candle_left', 'One Candle Left', 'Violet'], ['hh_seren_three_words', 'Three Words', 'Seren'],
  ['hw_veronica_velvet_fangs', 'Velvet Fangs', 'Veronica'], ['hh_veronica_world_inside_glass', 'A World Inside the Glass', 'Veronica'], ['hh_violet_before_it_disappears', 'Before It Disappears', 'Violet'],
  ['hw_seren_porcelain_party', 'Porcelain Party', 'Seren'], ['green', 'Green Light on the Window', 'Violet']];
// controls
document.getElementById('start').onclick = () => go(0);
document.getElementById('next').onclick = () => (step < STOPS.length - 1 ? go(step + 1) : go(-1));
document.getElementById('back').onclick = () => go(step - 1);
document.getElementById('skip').onclick = () => go(1);
// pull down on a step to step back out to the object before it (research: swipe down returns to the object)
let y0 = null; addEventListener('pointerdown', (e) => { y0 = step >= 0 && !e.target.closest('.rail,.songs,input') ? e.clientY : null; }, { passive: true });
addEventListener('pointerup', (e) => { if (y0 != null && e.clientY - y0 > 90) go(step - 1); y0 = null; });
// the press shows the instant a finger lands (same as the app, 10-22)
addEventListener('pointerdown', (e) => { const b = e.target.closest('.press'); if (!b) return; b.classList.add('down'); const t0 = performance.now();
  const up = () => { setTimeout(() => b.classList.remove('down'), Math.max(0, 140 - (performance.now() - t0))); removeEventListener('pointerup', up, true); removeEventListener('pointercancel', up, true); };
  addEventListener('pointerup', up, true); addEventListener('pointercancel', up, true); }, { capture: true, passive: true });
addEventListener('resize', () => aim(step));
drawProg();
// board.html shows every step at once: ?s=N opens straight on that step, with no walk-in
const q = new URLSearchParams(location.search), s0 = q.get('s');
if (q.has('veil')) document.documentElement.classList.add('veil');
if (s0 != null) { document.querySelector('.tag').hidden = true; document.documentElement.style.setProperty('--still', '1');
  const st = document.createElement('style'); st.textContent = '*{transition:none!important;transition-delay:0s!important}'; document.head.append(st);
  go(+s0); requestAnimationFrame(() => requestAnimationFrame(() => st.remove())); }
</script>
<script>
// ── entrance light (10-24) — 21st 2891 (reveal) + 19257 (text reveal), rebuilt for the room rather than pasted:
// a warm night instead of black (the room is still there), the lighting spreads from where the finger was, and once lit the canvas
// switches to soft-light so it only warms and shades the room (principle 11: light from one side, following the hand).
(() => {
  const c = document.getElementById('lamp'), ctx = c.getContext('2d'), body = document.body, hint = document.getElementById('hint');
  const still = new URLSearchParams(location.search).has('s') || matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ease = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  let W = 0, H = 0, x = -1e4, y = -1e4, tx = x, ty = y, phase = 'dark', t0 = performance.now(), last = 0, down = 0, onAt = 0, cx = 0, cy = 0;
  const R0 = () => Math.max(85, Math.min(W, H) * .28);   // the torch in the dark - .42 was too wide (영샘 10-24 '좁게')
  const RL = () => Math.max(120, Math.min(W, H) * .42);  // the soft glow that follows the hand once the room is lit
  function size() { const dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function at(px, py) { tx = px; ty = py; if (x < -1e3) { x = tx; y = ty; } last = performance.now(); body.classList.add('touched'); }

  // the name comes up letter by letter out of a mask (19257); italic needs a little room on the right or the mask clips it
  const units = [];
  ['brand', 'l1', 'l2'].forEach((id, row) => {
    const el = document.getElementById(id), text = el.textContent; el.textContent = ''; el.setAttribute('aria-label', text.trim());
    text.split(/(\s+)/).forEach((tok) => {
      if (/^\s+$/.test(tok)) { el.append(tok); return; }
      [...tok].forEach((ch) => {
        const m = document.createElement('span'); m.setAttribute('aria-hidden', 'true');
        Object.assign(m.style, { display: 'inline-block', overflow: 'hidden', verticalAlign: 'bottom', padding: '0 .12em .12em 0', margin: '0 -.12em 0 0' });
        const u = document.createElement('span'); u.textContent = ch; u.style.display = 'inline-block'; u.dataset.row = row;
        m.append(u); el.append(m); units.push(u);
      });
    });
  });
  function hideName() { units.forEach((u) => { u.style.transition = 'none'; u.style.transform = 'translateY(115%)'; }); }
  function showName(now) { units.forEach((u, i) => { u.style.transition = now ? 'none' : `transform 900ms cubic-bezier(.16,1,.3,1) ${+u.dataset.row * 220 + i * 28}ms`; u.style.transform = 'translateY(0)'; }); }

  function lightUp() {
    if (phase !== 'dark') return;
    phase = 'bloom'; onAt = performance.now(); cx = x > -1e3 ? x : W / 2; cy = x > -1e3 ? y : H * .45;
    navigator.vibrate && navigator.vibrate(20);
    setTimeout(() => { body.classList.remove('dark'); showName(); }, 900);
  }
  function reset() {
    phase = 'dark'; t0 = performance.now(); last = 0; x = y = tx = ty = -1e4; body.classList.remove('touched');
    c.classList.remove('lit'); body.classList.remove('lit'); body.classList.add('dark'); hideName();
  }

  addEventListener('pointerdown', (e) => { down = performance.now(); at(e.clientX, e.clientY); if (phase === 'dark' && e.pointerType === 'mouse') lightUp(); }, { passive: true });
  addEventListener('pointermove', (e) => { if (down || e.pointerType === 'mouse') at(e.clientX, e.clientY); }, { passive: true });
  addEventListener('pointerup', () => { down = 0; if (phase === 'dark' && last) lightUp(); }, { passive: true });
  addEventListener('pointercancel', () => { down = 0; }, { passive: true });
  document.getElementById('tag').addEventListener('click', reset);

  function draw(now) {
    requestAnimationFrame(draw);
    if (body.classList.contains('step')) return;
    if (phase === 'dark') {
      if (!last && now - t0 > 2200) {   // nobody has touched yet: the light wanders on its own, then lights the room by itself
        const t = now - t0; tx = W * (.5 + .28 * Math.sin(t * .00045)); ty = H * (.48 + .2 * Math.sin(t * .00071 + 1)); if (x < -1e3) { x = tx; y = ty; }
        if (t > 7000) lightUp();

    }

    if (x > -1e3) { const k = phase === 'lit' && now - last > 2500 ? .03 : .16; x += (tx - x) * k; y += (ty - y) * k; }

      const px = phase === 'bloom' ? cx : x, py = phase === 'bloom' ? cy : y, R = R0() + (Math.hypot(W, H) * 1.15 - R0()) * kR;
      ctx.fillStyle = `rgba(18,12,7,${.94 * (1 - kA)})`; ctx.fillRect(0, 0, W, H);
      if (px > -1e3) {

        let g = ctx.createRadialGradient(px, py, 0, px, py, R * 1.15); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.3, 'rgba(0,0,0,.9)'); g.addColorStop(.62, 'rgba(0,0,0,.45)'); g.addColorStop(.85, 'rgba(0,0,0,.12)'); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'source-over';
        g = ctx.createRadialGradient(px, py, 0, px, py, R * .8); g.addColorStop(0, `rgba(255,180,100,${.09 * (1 - kA)})`); g.addColorStop(1, 'rgba(255,180,100,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    } else {
      // soft-light: a faint brown everywhere shades the room, the warm white where the hand (or the window) is lifts it
      const idle = Math.min(1, Math.max(0, (now - last - 2500) / 2000)), R = RL() * (1.3 + idle * 1.1);
      ctx.fillStyle = 'rgba(70,45,20,.22)'; ctx.fillRect(0, 0, W, H);
      const g = ctx.createRadialGradient(x, y, 0, x, y, R); g.addColorStop(0, `rgba(255,236,200,${.62 - idle * .14})`); g.addColorStop(1, 'rgba(255,236,200,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }
  size(); addEventListener('resize', size);
  if (still) { phase = 'lit'; c.classList.add('lit'); body.classList.remove('dark'); body.classList.add('lit'); x = tx = W * .86; y = ty = H * .1; showName(true); }
  else hideName();
  requestAnimationFrame(draw);
})();
</script>
<script>
// ── style step (10-24): swipe the arch to wipe in the next look; its colour bleeds into the wall
(() => {

<script>
// ── photos step (10-24): tap an empty polaroid → the phone's own picker → each photo flies in on a curve, lands, develops
(() => {
  const $ = (id) => document.getElementById(id), wall = $('wall'), pick = $('pick'), no = $('photono'), next = $('next');
  // left %, top %, tilt, required - three rows that don't line up (principle 7)
  // (first try had each row on one line - it read as a grid; the tops now wander more)
  const SLOTS = [[4, 3, -4, 1], [36, -2, 3, 1], [68, 7, -2, 1], [0, 37, 3], [25, 29, -5], [51, 40, 4], [75, 31, -3], [7, 64, -3], [38, 71, 5], [67, 61, -1]];
  const cards = SLOTS.map(([l, t, r, req], i) => {
    const c = document.createElement('div'); c.className = 'pola' + (req ? ' req' : ''); c.dataset.r = r;
    c.style.cssText = `left:${l}%;top:${t}%;width:${req ? 29 : 24}%;--r:${r}deg`;
    c.innerHTML = `<i class="pin"></i><div class="ph"></div><span class="no">${i + 1}</span><button class="x glass press" aria-label="빼기">✕</button>`;
    wall.append(c); return c;
  });
  const filled = Array(SLOTS.length).fill(null);
  function count() { const n = filled.filter(Boolean).length; no.textContent = `PHOTOS · ${n} / ${SLOTS.length}`; next.classList.toggle('ready', n >= 3); }
  function fly(i, src, delay) {
    filled[i] = src; const card = cards[i], wr = wall.getBoundingClientRect(), r = +card.dataset.r;
    const w = card.offsetWidth, ex = wr.left + card.offsetLeft, ey = wr.top + card.offsetTop;
    const sx = innerWidth / 2 - w / 2, sy = innerHeight - 40, cx = (sx + ex) / 2 + (ex > sx ? -90 : 90), cy = Math.min(sy, ey) - 140, r0 = (Math.random() - .5) * 24;
    const f = document.createElement('div'); f.className = 'pola fly'; f.style.width = w + 'px';
    f.innerHTML = `<i class="pin"></i><div class="ph"><img src="${src}" alt=""></div>`; document.body.append(f);
    const frames = []; for (let k = 0; k <= 14; k++) { const t = k / 14, u = 1 - t;
      const x = u * u * sx + 2 * u * t * cx + t * t * ex, y = u * u * sy + 2 * u * t * cy + t * t * ey, s = t < .85 ? .55 + .53 * t / .85 : 1.08 - .08 * (t - .85) / .15;

  $('demo').addEventListener('click', () => { const used = new Set(filled); add(DEMO.filter((d) => !used.has(d)).slice(0, 5)); });

<script>
// ── song step (10-24): flick through the crate, tap a sleeve → the record slides out, flies to the platter, the needle drops, 15 s plays
(() => {
  const $ = (id) => document.getElementById(id), box = $('sleeves'), vinyl = $('vinyl'), label = $('label'), arm = $('arm'), deck = $('deck');
  const nameEl = $('songname'), noEl = $('songno'), next = $('next'), light = $('songlight');
  const src = (id) => (id === 'green' ? '../../test/assets/green_light.mp3' : `../../test/assets/songs/${id}.mp3`);
  // the line under the crate: only what the app's song list already says (core.js group) + who sings - no invented genres
  const GENRE = (i) => { const [id, , who] = SONGS[i]; const g = id.startsWith('hw_') ? 'HALLOWEEN' : id === 'green' ? 'HER HOURS · LYRICS' : 'HER HOURS · VOCAL'; return `<b>${g}</b>  ·  SUNG BY ${who.toUpperCase()}`; };
  const sleeves = SONGS.map(([id, n, who], i) => { const s = document.createElement('div'); s.className = 'sleeve'; s.style.backgroundImage = `url(covers/${id}.jpg)`; s.dataset.i = i; s.setAttribute('aria-label', n); box.append(s); return s; });
  // standing in the crate: the one in the middle stands up, the rest lean back and turn a little away (principle 6: follows the finger 1:1)
  function lean() {
    const r = box.getBoundingClientRect(), mid = r.left + r.width / 2;
    sleeves.forEach((s) => { const b = s.getBoundingClientRect(), d = Math.max(-2.5, Math.min(2.5, (b.left + b.width / 2 - mid) / 100)), a = Math.min(1, Math.abs(d));
      s.style.transform = `translateZ(${(1 - a) * 30}px) rotateX(${8 + a * 22}deg) rotateY(${-d * 14}deg) translateY(${a * 10}px)`; s.style.zIndex = 10 - Math.round(Math.abs(d) * 3); });
  }
  box.addEventListener('scroll', () => requestAnimationFrame(lean), { passive: true });
  let ctx = null, gain = null, audio = null, cur = -1, busy = false, stopT = 0;
  const cols = {};
  function colour(i) { const id = SONGS[i][0]; if (cols[id]) return Promise.resolve(cols[id]);
    return new Promise((ok) => { const im = new Image(); im.onload = () => { const c = document.createElement('canvas'); c.width = 6; c.height = 6; const x = c.getContext('2d'); x.drawImage(im, 0, 0, 6, 6);
      const d = x.getImageData(0, 0, 6, 6).data; let r = 0, g = 0, b = 0; for (let k = 0; k < d.length; k += 4) { r += d[k]; g += d[k + 1]; b += d[k + 2]; } r /= 36; g /= 36; b /= 36;
      const m = (r + g + b) / 3, f = (v) => Math.round(Math.max(0, Math.min(255, v + (v - m) * 1.1 + 30))); ok(cols[id] = `rgb(${f(r)} ${f(g)} ${f(b)})`); }; im.onerror = () => ok(''); im.src = `covers/${id}.jpg`; }); }

    clearTimeout(stopT); body.classList.remove('playing');
    if (audio) { const a = audio; fade(0, .6); setTimeout(() => a.pause(), 650); }
    arm.classList.remove('down'); setTimeout(() => vinyl.classList.remove('spin'), keepDisc ? 700 : 0);
  }
  function play(i) {
    // iOS only lets sound start inside the tap: start it now, silent through Web Audio, and let it rise when the needle lands

    if (audio) { audio.pause(); audio.src = ''; }
    audio = new Audio(src(SONGS[i][0])); audio.crossOrigin = 'anonymous'; audio.preload = 'auto';
    const node = ctx.createMediaElementSource(audio); gain = ctx.createGain(); gain.gain.value = 0; node.connect(gain).connect(ctx.destination);

    const sb = sleeves[i].getBoundingClientRect(), db = deck.getBoundingClientRect(), D = db.width * .94, sw = sb.width * .92;
    const f = document.createElement('div'); f.className = 'flydisc'; f.style.width = f.style.height = sw + 'px'; f.innerHTML = `<i style="background-image:url(covers/${SONGS[i][0]}.jpg)"></i>`;
    document.body.append(f);
    const x0 = sb.left + (sb.width - sw) / 2, y0 = sb.top, x2 = db.left + db.width * .03, y2 = db.top + db.height * .03, cx = (x0 + x2) / 2 + 70, cy = Math.min(y0, y2) - 30;

    // out of the sleeve (to .22) → a curve to a spot just above the platter, a touch large, shadow wide (to .72) →
    // then it settles down onto the platter, slowing all the way (영샘 10-24 '올라갔다가 감속으로 천천히 살짝 정착')

      { transform: `translate(${x0}px,${ys}px) scale(1) rotate(0deg)`, boxShadow: sh(8, .35), offset: .22, easing: 'linear' }];
    for (let k = 1; k <= 12; k++) { const t = io(k / 12), u = 1 - t, yh = y2 - hover;

      nameEl.animate([{ opacity: 0, transform: 'translateY(10px)', filter: 'blur(5px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 700, easing: 'cubic-bezier(.22,1,.36,1)' });

      stopT = setTimeout(() => { if (cur === i) stop(true); }, 15000); }, 1050);
  }
  box.addEventListener('click', (e) => { const s = e.target.closest('.sleeve'); if (s) choose(+s.dataset.i); });

  deck.addEventListener('click', () => { if (cur < 0 || busy) return; if (body.classList.contains('playing')) stop(true); else { busy = true; play(cur); drop(cur); } });

  if (body.classList.contains('s2')) window.songStep(true);
})();
