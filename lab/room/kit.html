<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#E9DDC9">
<title>Her Room · 버튼 한 벌</title>
<link rel="stylesheet" href="kit.css">
<style>
/* 10-22 영샘 "버튼은 최대한 투명한 느낌" — the kit judged where it lives: on the room itself, not on a blank sheet.
   The two knobs at the bottom (투명도 · 흐림) are 영샘's; the room page (index.html) reads the same setting. */
@font-face{font-family:HHTitle;src:url(fonts/PinyonScript-Regular.ttf)}
@font-face{font-family:HHSans;src:url(fonts/JosefinSans-SemiBold.ttf)}
*{box-sizing:border-box;margin:0}
html{background:#E9DDC9}
body{min-height:100%;color:var(--k-ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 150px);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url(room.jpg) center 70%/cover}
h1{font-family:HHTitle,cursive;font-weight:400;font-size:44px;color:#D9AE62;line-height:1.1;text-shadow:var(--k-title-depth)}
.sub{font-family:HHSans,sans-serif;font-size:10.5px;letter-spacing:.36em;margin-top:4px;color:var(--k-ink);text-shadow:var(--k-text-depth)}
section{margin-top:22px}
h2{font-family:HHSans,sans-serif;font-size:10.5px;letter-spacing:.3em;color:var(--k-ink);margin-bottom:10px;text-shadow:var(--k-text-depth)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.k-btn{flex:1 1 130px}
.lbl{font-size:12px;color:var(--k-ink);text-shadow:var(--k-text-depth)}
/* the knobs */
.tune{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:9;padding:12px 16px;border-radius:22px;
  background:rgb(255 253 248 / .82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgb(60 40 15 / .25)}
.tune label{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700}
.tune label + label{margin-top:8px}
.tune span{flex:0 0 52px}
.tune input{flex:1;accent-color:#7DB893}
.tune output{flex:0 0 46px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--k-ink-2)}
.tune .rs{margin-top:8px;display:flex;justify-content:space-between;font-size:12px;color:var(--k-ink-2)}
.tune .rs button{border:0;background:none;font:inherit;font-weight:700;color:var(--k-mint-ink);text-decoration:underline}
</style>
</head>
<body>
<h1>Her Room</h1><p class="sub">GLASS KIT · 투명 유리 한 벌</p>

<section><h2>BUTTONS · 버튼</h2>
  <div class="col">
    <div class="row"><button class="k-btn k-primary">이 스타일로</button><button class="k-btn">그대로 두기</button></div>
    <div class="row"><button class="k-btn k-on">고른 상태</button><button class="k-btn" disabled>쓸 수 없음</button></div>
    <div class="row"><button class="k-btn">← 방으로</button><button class="k-btn k-primary k-on">민트 · 고름</button></div>
  </div>
  <p class="lbl" style="margin-top:8px">눌러 보세요 — 누르는 순간 쏙 들어가요</p>
</section>

<section><h2>CHIPS · 작은 선택</h2>
  <div class="row" id="chips"><button class="k-chip k-on">✓ 15초</button><button class="k-chip">32초</button><button class="k-chip">60초</button><button class="k-chip">가사 켜기</button></div>
</section>

<section><h2>TABS · 탭</h2>
  <div class="k-seg"><span class="k-pebble"></span><button class="k-on">우리 노래</button><button>내 노래</button></div>
</section>

<section><h2>TOGGLE · 켜고 끄기</h2>
  <div class="row"><button class="k-toggle k-on" id="tg" aria-label="가사 자막"></button><span class="lbl" style="font-size:14px;font-weight:700">가사 자막</span></div>
</section>

<section><h2>NAME TAG · 물건 이름표</h2>
  <div class="row"><span class="k-tag"><small style="font-family:HHSans;font-size:9.5px;letter-spacing:.26em;color:var(--k-gold)">STYLE</small><b style="font-size:13px">스타일</b></span>
  <span class="k-tag"><small style="font-family:HHSans;font-size:9.5px;letter-spacing:.26em;color:var(--k-gold)">LIGHT IT</small><b style="font-size:13px">쇼츠 만들기</b></span></div>
</section>

<section><h2>ALERTS · 알림</h2>
  <div class="col"><div class="k-alert ok">✓ 다 만들었어요</div><div class="k-alert warn">! 사진이 한 장 더 있으면 좋아요</div><div class="k-alert err">× 노래를 못 읽었어요</div></div>
</section>

<section><h2>CARD · 카드</h2>
  <div class="k-card"><b style="font-family:HHTitle;font-weight:400;font-size:34px;color:#D9AE62;text-shadow:var(--k-title-depth)">Song</b><p style="margin-top:4px;font-size:13px;line-height:1.5">턴테이블에 노래를 걸어요. 고르면 바로 흘러나와요.</p></div>
</section>

<div class="tune">
  <label><span>투명도</span><input type="range" id="fill" min="0" max="0.45" step="0.01"><output id="fo"></output></label>
  <label><span>흐림</span><input type="range" id="blur" min="0" max="24" step="1"><output id="bo"></output></label>
  <div class="rs"><span>방 화면에도 같이 적용돼요</span><button id="rs">처음 값</button></div>
</div>

<script>
// 영샘's knobs: stored in this browser and shared with the room page (index.html reads 'hh-kit')
const K = { fill: .10, blur: 6 };
const root = document.documentElement;
let st = { ...K }; try { Object.assign(st, JSON.parse(localStorage.getItem('hh-kit') || '{}')); } catch {}
const apply = () => {
  root.style.setProperty('--k-fill', st.fill); root.style.setProperty('--k-blur', st.blur + 'px');
  fill.value = st.fill; blur.value = st.blur; fo.textContent = Math.round(st.fill * 100) + '%'; bo.textContent = st.blur + 'px';
  try { localStorage.setItem('hh-kit', JSON.stringify(st)); } catch {}
};
fill.oninput = () => { st.fill = +fill.value; apply(); };
blur.oninput = () => { st.blur = +blur.value; apply(); };
rs.onclick = () => { st = { ...K }; apply(); };
apply();
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.k-btn,.k-chip'); if (!b || b.disabled) return;
  b.classList.add('press'); const t0 = performance.now();
  const up = () => { setTimeout(() => b.classList.remove('press'), Math.max(0, 140 - (performance.now() - t0))); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); };
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
}, { passive: true });
document.querySelectorAll('#chips .k-chip').forEach((c) => c.onclick = () => { document.querySelectorAll('#chips .k-chip').forEach((x) => { x.classList.toggle('k-on', x === c); x.textContent = x.textContent.replace('✓ ', ''); }); c.textContent = '✓ ' + c.textContent; });
for (const seg of document.querySelectorAll('.k-seg')) {
  const peb = seg.querySelector('.k-pebble'), bs = [...seg.querySelectorAll('button')];
  const put = (b) => { peb.style.left = b.offsetLeft + 'px'; peb.style.width = b.offsetWidth + 'px'; bs.forEach((x) => x.classList.toggle('k-on', x === b)); };
  bs.forEach((b) => b.onclick = () => put(b)); requestAnimationFrame(() => put(seg.querySelector('.k-on')));
}
tg.onclick = (e) => e.currentTarget.classList.toggle('k-on');
</script>
</body>
</html>
