<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Her Room · 한 판</title>
<!-- 10-23 새벽: 모든 화면을 한 판에 나란히 — 방·유리·빛·글자 규칙(guide.html)이 화면마다 같은 집처럼 보이는지 한눈에.
     시안 있는 화면 = flow.html?s=N, 아직 없는 화면 = skeleton.html 회색 박스. 폰 크기(390x844)를 줄여서 보여 준다. -->
<style>
@font-face{font-family:HHSans;src:url(fonts/JosefinSans-SemiBold.ttf)}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(120% 60% at 80% 0%,#FBF4E8,#EFE3D0 45%,#E2D0B5);color:#3B2F22;font-family:"Pretendard Variable",-apple-system,"Malgun Gothic",sans-serif;min-height:100vh}
header{padding:22px 20px 6px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
h1{font:italic 300 34px/1 "Cormorant Garamond",Georgia,serif}
header p{font-size:14px;color:#6B5A45}
.wrap{display:flex;flex-wrap:wrap;gap:22px;padding:16px 20px 60px}
figure{display:flex;flex-direction:column;gap:8px;align-items:center}
.phone{width:calc(390px * var(--z));height:calc(844px * var(--z));border-radius:calc(44px * var(--z));overflow:hidden;position:relative;
  box-shadow:0 0 0 calc(8px * var(--z)) #2A231C,0 18px 40px -10px rgb(60 40 15 / .45)}
.phone iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform:scale(var(--z));transform-origin:0 0}
figcaption{font-family:HHSans,sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#B8893E}
figcaption i{display:block;font-family:"Pretendard Variable",sans-serif;font-style:normal;letter-spacing:0;text-transform:none;font-size:13px;color:#6B5A45;text-align:center;margin-top:2px}
.zoom{margin-left:auto;display:flex;gap:6px}
.zoom button{border:0;border-radius:999px;padding:8px 14px;font:700 13px sans-serif;background:rgb(255 255 255 / .5);box-shadow:inset 0 0 0 1px #fff;color:#3B2F22}
</style>
</head>
<body style="--z:.5">
<header><h1>Every room, at once</h1><p>시안 6 + 회색 뼈대 3 — 같은 집처럼 보이나</p>
  <div class="zoom"><button data-z=".38">작게</button><button data-z=".5">보통</button><button data-z=".72">크게</button></div></header>
<div class="wrap" id="wrap"></div>
<script>
const SCREENS = [
  ['flow.html?s=-1', 'Home', '첫 화면'], ['flow.html?s=0', 'i · Style', '스타일'], ['flow.html?s=1', 'ii · Photos', '사진'],
  ['flow.html?s=2', 'iii · Song', '노래'], ['flow.html?s=3', 'iv · Words', '글자'], ['flow.html?s=4', 'v · Light it', '만들기'],
  ['skeleton.html?k=making', 'Making', '만드는 중 (뼈대)'], ['skeleton.html?k=mine', 'My shorts', '내 영상 (뼈대)'], ['skeleton.html?k=about', 'About', '정보 (뼈대)'],
  // B: the same five steps with the cream veil - one house tone whichever object the camera walks into
  ['flow.html?s=0&veil', 'B · Style', '스타일 · 크림 막'], ['flow.html?s=1&veil', 'B · Photos', '사진 · 크림 막'], ['flow.html?s=2&veil', 'B · Song', '노래 · 크림 막'],
  ['flow.html?s=3&veil', 'B · Words', '글자 · 크림 막'], ['flow.html?s=4&veil', 'B · Light it', '만들기 · 크림 막'],
];
document.getElementById('wrap').innerHTML = SCREENS.map(([src, en, ko]) =>
  `<figure><div class="phone"><iframe src="${src}" title="${ko}"></iframe></div><figcaption>${en}<i>${ko}</i></figcaption></figure>`).join('');
document.querySelectorAll('.zoom button').forEach((b) => b.onclick = () => document.body.style.setProperty('--z', b.dataset.z));
</script>
</body>
</html>
